site_name: LookTalk Backend Docs
site_url: https://yongnuni.github.io/looktalk-backend/
repo_url: https://github.com/yongnuni/looktalk-backend
repo_name: yongnuni/looktalk-backend

theme:
  name: material
  language: ko
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - API Specification: LookTalk_Backend_API_Spec_v2.1.md
  - Database: database.md
  - Implementation: LookTalk_Backend_Implementation.md
