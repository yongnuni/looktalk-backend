spring:
  application:
    name: looktalk-backend
  profiles:
    active: local

server:
  port: 8080

looktalk:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-seconds: 900
  refresh-token:
    expiry-days: 14
  otp:
    secret: ${OTP_HMAC_SECRET}
    expiry-seconds: 300
  reset-token:
    expiry-seconds: 1800
  cors:
    # 배포 환경에서는 CORS_ALLOWED_ORIGINS 환경변수(콤마로 여러 origin 구분 가능)로 재정의한다.
    # local 기본값은 Frontend(Vite) 개발 서버 origin이다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}