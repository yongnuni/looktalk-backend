spring:
  application:
    name: looktalk-backend
  # profiles.active를 여기서 강제하지 않는다. SPRING_PROFILES_ACTIVE를 깜빡한 배포 환경이 조용히 local
  # profile(및 그 logging mail 기본값)로 기동되는 것을 막기 위함이다. local 개발/테스트는 반드시
  # SPRING_PROFILES_ACTIVE=local을 명시적으로 지정해야 하며, build.gradle의 test task가 이를 기본 제공한다.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}

server:
  port: 8080

looktalk:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-seconds: 900
  refresh-token:
    expiry-days: 14
  otp:
    secret: ${OTP_HMAC_SECRET}
    expiry-seconds: 300
  reset-token:
    expiry-seconds: 1800
  cors:
    # 배포 환경에서는 CORS_ALLOWED_ORIGINS 환경변수(콤마로 여러 origin 구분 가능)로 재정의한다.
    # local 기본값은 Frontend(Vite) 개발 서버 origin이다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    # 여기서는 기본값을 두지 않는다(JWT_SECRET/OTP_HMAC_SECRET과 동일한 방식). local profile은
    # application-local.yml이 이 값을 logging 기본값으로 덮어써 이 placeholder를 아예 평가하지 않는다.
    # 그 외 profile은 application-local.yml이 로드되지 않으므로, MAIL_PROVIDER를 명시적으로 설정하지 않으면
    # 이 placeholder 해석 자체가 실패해 애플리케이션이 기동 실패한다(logging으로 조용히 fallback되는 것을 막기
    # 위함). MAIL_PROVIDER=smtp로 설정하면 정상적으로 SmtpEmailSender가 선택된다.
    provider: ${MAIL_PROVIDER}
    from: ${MAIL_FROM:}