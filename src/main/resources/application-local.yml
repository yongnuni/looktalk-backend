spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/looktalk
    username: looktalk
    password: looktalk
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

looktalk:
  mail:
    # local/test 전용 기본값. MAIL_PROVIDER를 설정하지 않으면 LoggingEmailSender를 사용한다.
    # 배포 환경은 application.yml(base)에만 있는 무기본값 설정을 통해 MAIL_PROVIDER를 명시하도록 강제한다.
    provider: ${MAIL_PROVIDER:logging}